name: Release QGIS Plugin

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional explicit release tag (defaults to v<version> from metadata.txt)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  prepare-release:
    name: Resolve Release Tag from Metadata or Tag Push
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.resolve.outputs.should_release }}
      tag_name: ${{ steps.resolve.outputs.tag_name }}

    steps:
      - name: Checkout repository with full tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version tag and create tag when bumped on main
        id: resolve
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          META_VERSION=$(python -c "import configparser; cp = configparser.RawConfigParser(); cp.read('vector_data_office_boy/metadata.txt', encoding='utf-8'); print(cp.get('general', 'version').strip())")
          if [ -z "$META_VERSION" ]; then
            echo "ERROR: version= is missing in vector_data_office_boy/metadata.txt" >&2
            exit 1
          fi

          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            SHOULD_RELEASE="true"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${INPUT_TAG:-v${META_VERSION}}"
            if ! git rev-parse -q --verify "refs/tags/${TAG_NAME}" >/dev/null; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a "${TAG_NAME}" -m "Release ${TAG_NAME}"
              git push origin "${TAG_NAME}"
            fi
            SHOULD_RELEASE="true"
          else
            TAG_NAME="v${META_VERSION}"
            git fetch --tags origin
            if git rev-parse -q --verify "refs/tags/${TAG_NAME}" >/dev/null; then
              echo "Tag ${TAG_NAME} already exists; skipping automatic release."
              SHOULD_RELEASE="false"
            else
              echo "Detected new version ${META_VERSION}; creating and pushing tag ${TAG_NAME}..."
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a "${TAG_NAME}" -m "Release ${TAG_NAME}"
              git push origin "${TAG_NAME}"
              SHOULD_RELEASE="true"
            fi
          fi

          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "should_release=${SHOULD_RELEASE}" >> "$GITHUB_OUTPUT"

  build-and-release:
    name: Validate, Package ZIP, and Publish GitHub Release
    needs: prepare-release
    if: ${{ needs.prepare-release.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag_name }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install validation and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit pytest geopandas shapely pyogrio pydantic requests pillow

      - name: Run Ruff linter
        run: ruff check .

      - name: Run Bandit SAST on Python sources
        run: bandit -c pyproject.toml -r scripts vector_data_office_boy

      - name: Run Pytest suite
        run: pytest -v

      - name: Build and validate QGIS plugin archive
        run: |
          python scripts/package_plugin.py --validate --check-tag "${{ needs.prepare-release.outputs.tag_name }}"

      - name: Publish GitHub Release with QGIS plugin ZIP and SHA256SUMS
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag_name }}
          name: Vector Data Office Boy ${{ needs.prepare-release.outputs.tag_name }}
          generate_release_notes: true
          files: |
            dist/vector_data_office_boy.zip
            dist/SHA256SUMS.txt
