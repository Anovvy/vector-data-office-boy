name: CI Pipeline

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-sast-and-tests:
    name: Lint, Bandit SAST, and Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit pytest geopandas shapely pyogrio pydantic requests pillow

      - name: Run Ruff linter
        run: ruff check .

      - name: Run Bandit SAST on Python sources
        run: |
          targets=("scripts")
          if [ -d "vector_data_office_boy" ]; then
            targets+=("vector_data_office_boy")
          fi
          bandit -c pyproject.toml -r "${targets[@]}"

      - name: Run Pytest suite
        run: pytest -v

      - name: Validate QGIS plugin archive when package exists
        if: ${{ hashFiles('vector_data_office_boy/metadata.txt', 'scripts/package_plugin.py') != '' }}
        run: |
          if [ -f "vector_data_office_boy/metadata.txt" ] && [ -f "scripts/package_plugin.py" ]; then
            python scripts/package_plugin.py --validate
          else
            echo "Skipping plugin archive validation until plugin package and packager exist."
          fi
